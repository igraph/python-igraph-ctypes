# Basic types

ERROR:
  PY_TYPE: int
  CTYPES_RETURN_TYPE: handle_igraph_error_t

BOOLEAN:
  PY_TYPE: bool
  INCONV:
    IN: "%C% = any_to_igraph_bool_t(%I%)"
    OUT: "%C% = igraph_bool_t()"

INTEGER:
  PY_TYPE: int
  INCONV:
    OUT: "%C% = igraph_int_t()"
  DEFAULT:
    UNLIMITED: "-1" # value of IGRAPH_UNLIMITED

REAL:
  PY_TYPE: float
  INCONV:
    OUT: "%C% = igraph_real_t()"
  DEFAULT:
    UNLIMITED: "-1" # value of IGRAPH_UNLIMITED

INT:
  PY_TYPE: int
  INCONV:
    OUT: "%C% = c_int()"

DOUBLE:
  PY_TYPE: float
  INCONV:
    OUT: "%C% = c_double()"

CSTRING:
  PY_TYPE: str
  INCONV:
    IN: '%C% = %I%.encode("utf-8")'
    OUT: "%C% = c_char_p()"
  OUTCONV: "%I% = bytes_to_str(%C%)"

# Vectors, matrices

VECTOR:
  PY_TYPE: Iterable[float]
  PY_RETURN_TYPE: RealArray
  INCONV:
    IN: "%C% = iterable_to_igraph_vector_t_view(%I%)"
    INOUT: "%C% = iterable_to_igraph_vector_t(%I%)"
    OUT: "%C% = _Vector.create(0)"
  OUTCONV: "%I% = igraph_vector_t_to_numpy_array(%C%)"

VECTOR_INT:
  PY_TYPE: Iterable[int]
  PY_RETURN_TYPE: IntArray
  INCONV:
    IN: "%C% = iterable_to_igraph_vector_int_t_view(%I%)"
    INOUT: "%C% = iterable_to_igraph_vector_int_t(%I%)"
    OUT: "%C% = _VectorInt.create(0)"
  OUTCONV: "%I% = igraph_vector_int_t_to_numpy_array(%C%)"

VECTOR_BOOL:
  # we can convert anything into a bool, but we declare the type as
  # Iterable[bool] only to nudge the user towards using bools
  PY_TYPE: Iterable[bool]
  PY_RETURN_TYPE: BoolArray
  INCONV:
    IN: "%C% = iterable_to_igraph_vector_bool_t_view(%I%)"
    INOUT: "%C% = iterable_to_igraph_vector_bool_t(%I%)"
    OUT: "%C% = _VectorBool.create(0)"
  OUTCONV: "%I% = igraph_vector_bool_t_to_numpy_array(%C%)"

INDEX_VECTOR:
  PY_TYPE: Iterable[int]
  PY_RETURN_TYPE: IntArray
  INCONV:
    IN: "%C% = iterable_to_igraph_vector_int_t_view(%I%)"
    INOUT: "%C% = iterable_to_igraph_vector_int_t(%I%)"
    OUT: "%C% = _VectorInt.create(0)"
  OUTCONV: "%I% = igraph_vector_int_t_to_numpy_array(%C%)"

MATRIX:
  PY_TYPE: MatrixLike
  PY_RETURN_TYPE: RealArray
  INCONV:
    IN: "%C% = sequence_to_igraph_matrix_t_view(%I%)"
    INOUT: "%C% = sequence_to_igraph_matrix_t(%I%)"
    OUT: "%C% = _Matrix.create(0, 0)"
  OUTCONV: "%I% = igraph_matrix_t_to_numpy_array(%C%)"

MATRIX_INT:
  PY_TYPE: MatrixIntLike
  PY_RETURN_TYPE: IntArray
  INCONV:
    IN: "%C% = sequence_to_igraph_matrix_int_t_view(%I%)"
    INOUT: "%C% = sequence_to_igraph_matrix_int_t(%I%)"
    OUT: "%C% = _MatrixInt.create(0, 0)"
  OUTCONV: "%I% = igraph_matrix_int_t_to_numpy_array(%C%)"

# Lists of vectors, matrices and strings

VECTOR_LIST:
  PY_TYPE: Iterable[Iterable[float]]
  PY_RETURN_TYPE: list[RealArray]
  INCONV:
    IN: "%C% = iterable_of_iterable_to_igraph_vector_list_t(%I%)"
    OUT: "%C% = _VectorList.create(0)"
  OUTCONV: "%I% = igraph_vector_list_t_to_list_of_numpy_array(%C%)"

VECTOR_INT_LIST:
  PY_TYPE: Iterable[Iterable[int]]
  PY_RETURN_TYPE: list[IntArray]
  INCONV:
    IN: "%C% = iterable_of_iterable_to_igraph_vector_int_list_t(%I%)"
    OUT: "%C% = _VectorIntList.create(0)"
  OUTCONV: "%I% = igraph_vector_int_list_t_to_list_of_numpy_array(%C%)"

MATRIX_LIST:
  PY_TYPE: Iterable[MatrixLike]
  PY_RETURN_TYPE: list[RealArray]
  INCONV:
    IN: "%C% = iterable_of_matrices_to_igraph_matrix_list_t(%I%)"
    OUT: "%C% = _MatrixList.create(0)"
  OUTCONV: "%I% = igraph_matrix_list_t_to_list_of_numpy_array(%C%)"

VECTOR_STR:
  PY_TYPE: Iterable[str]
  PY_RETURN_TYPE: list[str]
  INCONV:
    IN: "%C% = iterable_of_strings_to_igraph_strvector_t(%I%)"
    OUT: "%C% = _StrVector.create(0)"
  OUTCONV: "%I% = igraph_strvector_t_to_list(%C%)"

# Graph, vertex and edge related classes

GRAPH:
  PY_TYPE: Graph
  INCONV:
    OUT: "%C% = _Graph()"
  OUTCONV:
    OUT: |-
      %I% = _create_graph_from_boxed(%C%)
    INOUT: ~

VERTEX:
  PY_TYPE: VertexLike
  PY_RETURN_TYPE: int
  INCONV:
    IN: "%C% = vertexlike_to_igraph_int_t(%I%)"
    OUT: "%C% = igraph_int_t(0)"

VERTEX_COLORS:
  PY_TYPE: Iterable[int]
  PY_RETURN_TYPE: IntArray
  INCONV:
    IN: "%C% = vertex_colors_to_igraph_vector_int_t_view(%I%, %I1%)"
    INOUT: "%C% = vertex_colors_to_igraph_vector_int_t(%I%, %I1%)"
    OUT: "%C% = _VectorInt.create(0)"
  OUTCONV: "%I% = igraph_vector_int_t_to_numpy_array(%C%)"

VERTEX_INDICES:
  PY_TYPE: Iterable[VertexLike]
  PY_RETURN_TYPE: IntArray
  INCONV:
    IN: "%C% = iterable_vertex_indices_to_igraph_vector_int_t(%I%)"
    OUT: "%C% = _VectorInt.create(0)"
  OUTCONV: "%I% = igraph_vector_int_t_to_numpy_array(%C%)"

GRAPH_LIST:
  PY_TYPE: Iterable[Graph]
  PY_RETURN_TYPE: list[Graph]
  INCONV:
    OUT: "%C% = _GraphList.create(0)"
  OUTCONV: "%I% = igraph_graph_list_t_to_list_of_graphs(%C%)"

GRAPH_PTR_LIST:
  PY_TYPE: Iterable[Graph]
  INCONV:
    IN: "%C% = iterable_of_graphs_to_igraph_vector_ptr_t(%I%)"

ALL_VERTEX_QTY:
  PY_TYPE: Iterable[float]
  PY_RETURN_TYPE: RealArray
  INCONV:
    OUT: "%C% = _Vector.create(0)"
  OUTCONV: "%I% = igraph_vector_t_to_numpy_array(%C%)"

VERTEX_INDICES_LIST:
  PY_TYPE: Iterable[Iterable[VertexLike]]
  PY_RETURN_TYPE: list[IntArray]
  INCONV:
    IN: "%C% = iterable_of_vertex_index_iterable_to_igraph_vector_int_list_t(%I%)"
    OUT: "%C% = _VectorIntList.create(0)"
  OUTCONV: "%I% = igraph_vector_int_list_t_to_list_of_numpy_array(%C%)"

VERTEX_INDEX_PAIRS:
  PY_TYPE: Iterable[VertexPair]
  INCONV:
    IN: "%C% = vertex_pairs_to_igraph_vector_int_t(%I%)"
    OUT: "%C% = _VectorInt.create(0)"

VERTEX_SELECTOR:
  PY_TYPE: VertexSelector
  INCONV:
    IN: "%C% = vertex_selector_to_igraph_vs_t(%I%, %I1%)"
  DEFAULT:
    ALL: '"all"'
  CALL: "%C%.unwrap()"

VERTEX_QTY:
  PY_TYPE: Iterable[float]
  PY_RETURN_TYPE: RealArray
  INCONV:
    IN: "%C% = vertex_qty_to_igraph_vector_t_view(%I%, %I1%)"
    INOUT: "%C% = vertex_qty_to_igraph_vector_t(%I%, %I1%)"
    OUT: "%C% = _Vector.create(0)"
  OUTCONV: "%I% = igraph_vector_t_to_numpy_array(%C%)"

VERTEX_WEIGHTS:
  PY_TYPE: Iterable[float]
  PY_RETURN_TYPE: RealArray
  INCONV:
    IN: "%C% = vertex_weights_to_igraph_vector_t_view(%I%, %I1%)"
    INOUT: "%C% = vertex_weights_to_igraph_vector_t(%I%, %I1%)"
    OUT: "%C% = _Vector.create(0)"
  OUTCONV: "%I% = igraph_vector_t_to_numpy_array(%C%)"

EDGE:
  PY_TYPE: EdgeLike
  PY_RETURN_TYPE: int
  INCONV:
    IN: "%C% = edgelike_to_igraph_int_t(%I%)"
    OUT: "%C% = igraph_int_t(0)"

EDGE_COLORS:
  PY_TYPE: Iterable[int]
  PY_RETURN_TYPE: IntArray
  INCONV:
    IN: "%C% = edge_colors_to_igraph_vector_int_t_view(%I%, %I1%)"
    INOUT: "%C% = edge_colors_to_igraph_vector_int_t(%I%, %I1%)"
    OUT: "%C% = _VectorInt.create(0)"
  OUTCONV: "%I% = igraph_vector_int_t_to_numpy_array(%C%)"

EDGE_INDICES:
  PY_TYPE: Iterable[EdgeLike]
  PY_RETURN_TYPE: IntArray
  INCONV:
    IN: "%C% = iterable_edge_indices_to_igraph_vector_int_t(%I%)"
    OUT: "%C% = _VectorInt.create(0)"
  OUTCONV: "%I% = igraph_vector_int_t_to_numpy_array(%C%)"

EDGE_INDICES_LIST:
  PY_TYPE: Iterable[Iterable[EdgeLike]]
  PY_RETURN_TYPE: list[IntArray]
  INCONV:
    IN: "%C% = iterable_of_edge_index_iterable_to_igraph_vector_int_list_t(%I%)"
    OUT: "%C% = _VectorIntList.create(0)"
  OUTCONV: "%I% = igraph_vector_int_list_t_to_list_of_numpy_array(%C%)"

EDGE_SELECTOR:
  PY_TYPE: EdgeSelector
  INCONV:
    IN: "%C% = edge_selector_to_igraph_es_t(%I%, %I1%)"
  DEFAULT:
    ALL: '"all"'
  CALL: "%C%.unwrap()"

EDGE_WEIGHTS:
  PY_TYPE: Iterable[float]
  PY_RETURN_TYPE: RealArray
  INCONV:
    IN: "%C% = edge_weights_to_igraph_vector_t_view(%I%, %I1%)"
    INOUT: "%C% = edge_weights_to_igraph_vector_t(%I%, %I1%)"
    OUT: "%C% = _Vector.create(0)"
  OUTCONV: "%I% = igraph_vector_t_to_numpy_array(%C%)"

EDGE_LENGTHS:
  PY_TYPE: Iterable[float]
  PY_RETURN_TYPE: RealArray
  INCONV:
    IN: "%C% = edge_lengths_to_igraph_vector_t_view(%I%, %I1%)"
    INOUT: "%C% = edge_lengths_to_igraph_vector_t(%I%, %I1%)"
    OUT: "%C% = _Vector.create(0)"
  OUTCONV: "%I% = igraph_vector_t_to_numpy_array(%C%)"

EDGE_CAPACITIES:
  PY_TYPE: Iterable[float]
  PY_RETURN_TYPE: RealArray
  INCONV:
    IN: "%C% = edge_capacities_to_igraph_vector_t_view(%I%, %I1%)"
    INOUT: "%C% = edge_capacities_to_igraph_vector_t(%I%, %I1%)"
    OUT: "%C% = _Vector.create(0)"
  OUTCONV: "%I% = igraph_vector_t_to_numpy_array(%C%)"

BIPARTITE_TYPES:
  PY_TYPE: Iterable[Any]
  PY_RETURN_TYPE: BoolArray
  INCONV:
    IN: "%C% = iterable_to_igraph_vector_bool_t_view(%I%) if %I% is not None else None"
    INOUT: "%C% = iterable_to_igraph_vector_bool_t(%I%) if %I% is not None else None"
    OUT: "%C% = _VectorBool.create(0)"

# Attribute handling

ATTRIBUTES:
  PY_TYPE: ~

EDGE_ATTRIBUTE_COMBINATION:
  PY_TYPE: AttributeCombinationSpecification
  INCONV:
    IN: "%C% = mapping_to_attribute_combination_t(%I%)"
  DEFAULT:
    Default: "None"

VERTEX_ATTRIBUTE_COMBINATION:
  PY_TYPE: AttributeCombinationSpecification
  INCONV:
    IN: "%C% = mapping_to_attribute_combination_t(%I%)"
  DEFAULT:
    Default: "None"

# Results of simulations

SIR_LIST:
  PY_TYPE: Iterable[SIRSimulation]
  PY_RETURN_TYPE: list[SIRSimulation]
  INCONV:
    OUT: "%C% = _SIRList.create(0)"
  OUTCONV: "%I% = igraph_sir_list_to_list_of_sir_simulations(%C%)"

# File I/O

INFILE:
  PY_TYPE: FileLike
  PY_RETURN_TYPE: c_int
  INCONV:
    IN: '%C% = %S%.enter_context(any_to_file_ptr(%I%, "r"))'
  FLAGS: stack

OUTFILE:
  PY_TYPE: FileLike
  PY_RETURN_TYPE: c_int
  INCONV:
    IN: '%C% = %S%.enter_context(any_to_file_ptr(%I%, "w"))'
  FLAGS: stack

# Enums
#
# The abstract types of enums are generated by codegen/run.py into
# types_enums.yaml; the entries below override the generated ones.

ADD_WEIGHTS:
  DEFAULT:
    "True": '"yes"'
    "False": '"no"'

LSETYPE:
  # The default depends on the directedness of the graph: "d_a" for undirected
  # graphs and "oap" for directed ones
  INCONV:
    IN: |-
      %C% = c_int(_enums.LaplacianSpectralEmbeddingType.from_(%I% if %I% is not None else ("oap" if %I1%.is_directed() else "d_a")))
  DEFAULT:
    Default: "None"
